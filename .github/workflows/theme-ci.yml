name: Theme CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate Ghost theme
        run: npm run test:ci
      - name: Package theme
        run: npm run zip
      - name: Validate installable archive
        run: npm run test:zip
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-research-pro-theme
          path: dist/ghost-research-pro.zip
          if-no-files-found: error
